swagger: "2.0"
info:
  title: CardioGo API
  description: >
    Documentación de la API de CardioGo.  
    **Autenticación con JWT:**  
    1. Ve al endpoint POST /auth/login.  
       Usa "Try it out" para enviar un email y contraseña de un usuario existente en tu base de datos.  
       Ejemplo:  
       email: juan.gonzalez@example.com  
       password: 123456  
       Copia el `access_token` recibido.  
    2. Haz clic en "Authorize" en Swagger y pega: `Bearer <access_token>`  
       ¡Listo! Ahora puedes probar endpoints protegidos.
  version: "1.0.0"

host: localhost:5000
basePath: /cardio-go/v1
schemes:
  - http

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Usa el token JWT con el prefijo `Bearer `, ejemplo: `Bearer eyJhbGciOiJIUzI1Ni...`"

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login de usuario
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                example: juan.gonzalez@example.com
              password:
                type: string
                example: "123456"
      responses:
        200:
          description: Login exitoso
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  user_id:
                    type: integer
                    example: 19
        401:
          description: Credenciales inválidas

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refrescar token
      security:
        - BearerAuth: []
      responses:
        200:
          description: Token refrescado
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  access_token:
                    type: string
        401:
          description: Token inválido o expirado
        422:
          description: Token inválido

  /auth/protected:
    get:
      tags:
        - Auth
      summary: Endpoint protegido
      security:
        - BearerAuth: []
      responses:
        200:
          description: Acceso autorizado
          schema:
            type: object
            properties:
